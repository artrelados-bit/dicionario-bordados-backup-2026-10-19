
<svg width="1200" height="896" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label-title { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 17px; font-weight: bold; fill: #111111; }
      .label-desc { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 13px; font-weight: normal; fill: #555555; }
      .lead-line { stroke: #222222; stroke-width: 1.2; stroke-dasharray: none; fill: none; }
      .lead-dot { fill: #111111; }
    </style>
  </defs>

  <!-- 1. Cone de Linha -->
  <circle cx="280" cy="225" r="3.5" class="lead-dot" />
  <polyline points="280,225 180,225 180,205 60,205" class="lead-line" />
  <text x="60" y="195" class="label-title">Cone de Linha Industrial</text>
  <text x="60" y="225" class="label-desc">Poliéster trilobal ou linha metálica</text>

  <!-- 2. Aplicador de Silicone -->
  <circle cx="640" cy="155" r="3.5" class="lead-dot" />
  <polyline points="640,155 760,155 760,135 840,135" class="lead-line" />
  <text x="845" y="128" class="label-title">Aplicador de Silicone Puro</text>
  <text x="845" y="150" class="label-desc">Feltro dosador com óleo 350 cSt</text>

  <!-- 3. Guias e Discos de Tensão -->
  <circle cx="590" cy="415" r="3.5" class="lead-dot" />
  <polyline points="590,415 750,415 750,395 840,395" class="lead-line" />
  <text x="845" y="388" class="label-title">Guias e Discos de Tensão</text>
  <text x="845" y="410" class="label-desc">Passagem suave sem atrito mecânico</text>

  <!-- 4. Calcador de Mola e Agulha -->
  <circle cx="505" cy="670" r="3.5" class="lead-dot" />
  <polyline points="505,670 380,670 380,690 60,690" class="lead-line" />
  <text x="60" y="680" class="label-title">Calcador de Mola e Agulha</text>
  <text x="60" y="705" class="label-desc">Resfriamento térmico a 1.000 PPM</text>

  <!-- 5. Bastidor Eletrônico e Pantógrafo -->
  <circle cx="690" cy="780" r="3.5" class="lead-dot" />
  <polyline points="690,780 780,780 780,760 840,760" class="lead-line" />
  <text x="845" y="753" class="label-title">Bastidor Eletrônico</text>
  <text x="845" y="775" class="label-desc">Fixação firme no pantógrafo</text>
</svg>
