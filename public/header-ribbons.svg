<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" fill="none" preserveAspectRatio="none">
  <!-- Dynamic, fine embroidery thread curves perfectly matching the reference image -->
  <!-- The lines start on the left mid/bottom, sweep gracefully below the center titles, and sweep off to the right edges without obstructing texts or buttons -->
  
  <!-- Ribbon 1 - Main upper-left to bottom-center sweeping strand -->
  <path d="M -30,110 C 180,110 380,180 620,215 C 880,250 1150,230 1420,185 C 1510,170 1570,150 1630,140" stroke="#E11D48" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M -30,120 C 180,120 375,185 615,218 C 875,253 1145,233 1415,190 C 1505,175 1565,155 1630,145" stroke="#BE123C" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  
  <!-- Ribbon 2 - Second main crossing ribbon from middle left looping towards center and right -->
  <path d="M -30,90 C 140,115 320,175 580,210 C 840,245 1100,235 1380,195 C 1480,180 1550,165 1630,155" stroke="#D91656" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M -30,70 C 120,105 280,160 520,200 C 760,240 1020,240 1320,205 C 1440,190 1530,175 1630,165" stroke="#FB7185" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.75"/>
  
  <!-- Ribbon 3 - Low sweeping curve along the bottom floor -->
  <path d="M -30,145 C 150,165 350,205 600,228 C 850,250 1120,245 1390,210 C 1490,195 1560,180 1630,172" stroke="#BE123C" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M -30,175 C 160,195 360,225 610,238 C 860,250 1130,248 1400,220 C 1500,208 1570,195 1630,188" stroke="#E11D48" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Left fan burst curves (delicate side filaments) -->
  <path d="M -30,50 C 100,85 240,140 450,185 C 660,230 900,245 1200,225 C 1380,210 1510,190 1630,180" stroke="#F43F5E" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M -30,195 C 120,210 300,232 530,238 C 760,244 1000,242 1260,228 C 1420,218 1530,205 1630,198" stroke="#9F1239" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Subtle right flare curves -->
  <path d="M 950,235 C 1180,220 1380,180 1630,135" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 1020,240 C 1230,228 1420,190 1630,150" stroke="#BE123C" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
