<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Amarelo Ouro Vibrante do DIBE -->
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD034"/>
      <stop offset="45%" stop-color="#F9BC06"/>
      <stop offset="100%" stop-color="#E5A700"/>
    </linearGradient>

    <!-- Gradiente do Livro (Capa Elegante) -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1A08"/>
      <stop offset="100%" stop-color="#180C03"/>
    </linearGradient>

    <!-- Gradiente das Páginas Abertas -->
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="85%" stop-color="#FFF8E0"/>
      <stop offset="100%" stop-color="#E8D5A7"/>
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8D5A7"/>
      <stop offset="15%" stop-color="#FFF8E0"/>
      <stop offset="100%" stop-color="#FFFDF5"/>
    </linearGradient>

    <!-- Gradiente da Agulha Cromada de Bordar -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Sombra suave para relevo 3D de bordado -->
    <filter id="embossShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#7C5200" flood-opacity="0.45"/>
    </filter>
    <filter id="stitchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#805000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. FUNDO AMARELO OURO DE PONTA A PONTA COM CANTOS SUAVEMENTE ARREDONDADOS (ÍCONE ADAPTATIVO ANDROID / PWA) -->
  <rect width="512" height="512" rx="108" fill="url(#goldBg)"/>

  <!-- 2. COSTURA PESPONTADA (LINHA PONTILHADA DE BORDADO DUPLA EM VOLTA) -->
  <!-- Costura Externa em Ponto Alinhavado Marrom Escuro / Caramelo Queimado -->
  <rect x="34" y="34" width="444" height="444" rx="84" 
        fill="none" 
        stroke="#6E4400" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-dasharray="17 13" 
        filter="url(#stitchGlow)"/>

  <!-- Costura Interna Delicada em Fio Branco Pérola -->
  <rect x="52" y="52" width="408" height="408" rx="68" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-dasharray="14 11" 
        opacity="0.95"/>

  <!-- 3. SÍMBOLO CENTRAL: LIVRO ABERTO DO DIBE (CONHECIMENTO & CONSULTORIA TÉCNICA) -->
  <g filter="url(#embossShadow)">
    <!-- Base / Capa do Livro em Couro Escuro -->
    <path d="M 120 338 Q 256 364 256 322 Q 256 364 392 338 L 392 358 Q 256 384 256 342 Q 256 384 120 358 Z" 
          fill="#1C0E03"/>

    <!-- Folhas Esquerda do Livro -->
    <path d="M 256 320 Q 186 288 126 304 L 126 196 Q 186 182 256 210 Z" 
          fill="url(#pageGradLeft)" 
          stroke="#422405" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Folhas Direita do Livro -->
    <path d="M 256 320 Q 326 288 386 304 L 386 196 Q 326 182 256 210 Z" 
          fill="url(#pageGradRight)" 
          stroke="#422405" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Lombada Central / Junção Costurada das Páginas -->
    <path d="M 256 208 L 256 322" stroke="#663A0A" stroke-width="6" stroke-linecap="round"/>

    <!-- Linhas de Texto / Pontos Técnicos da Página Esquerda (Estilizados como Pespontos de Bordado) -->
    <line x1="154" y1="228" x2="228" y2="238" stroke="#B87714" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="7 5"/>
    <line x1="150" y1="250" x2="232" y2="260" stroke="#7A4C07" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="10 6"/>
    <line x1="152" y1="272" x2="226" y2="282" stroke="#B87714" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 5"/>

    <!-- Linhas de Texto / Pontos Técnicos da Página Direita -->
    <line x1="284" y1="238" x2="358" y2="228" stroke="#B87714" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="7 5"/>
    <line x1="280" y1="260" x2="362" y2="250" stroke="#7A4C07" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="10 6"/>
    <line x1="286" y1="282" x2="360" y2="272" stroke="#B87714" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 5"/>
  </g>

  <!-- 4. AGULHA DE BORDADO METÁLICA (DIAGONAL ELEGANTE ATRAVESSANDO AS PÁGINAS) -->
  <g filter="url(#embossShadow)">
    <!-- Linha de Bordado Azul Artrelados (Laçada que sai do olho da agulha) -->
    <path d="M 335 125 C 385 85 410 145 350 175 C 310 195 275 160 295 145" 
          fill="none" 
          stroke="#008CC9" 
          stroke-width="5.5" 
          stroke-linecap="round"/>

    <!-- Corpo da Agulha de Aço (Inclinada) -->
    <polygon points="360,105 348,93 216,252 210,274 232,268" 
             fill="url(#needleGrad)" 
             stroke="#1E293B" 
             stroke-width="2.5"/>

    <!-- Olho da Agulha Expandido (Sistema DBxK5 / Bordado Computadorizado) -->
    <ellipse cx="346" cy="112" rx="3.5" ry="9" 
             transform="rotate(45 346 112)" 
             fill="#0F172A"/>

    <!-- Brilho na Ponta de Aço -->
    <circle cx="212" cy="272" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- 5. SELO DIBE NA PARTE INFERIOR (TIPOGRAFIA SLACKEY EMBORRACHADA / BORDADA) -->
  <g filter="url(#embossShadow)">
    <text x="256" y="426" 
          text-anchor="middle" 
          font-family="'Slackey', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="64" 
          letter-spacing="4"
          fill="#1A0E03" 
          stroke="#FFF6D6" 
          stroke-width="3"
          paint-order="stroke fill">
      DIBE
    </text>
  </g>
</svg>
