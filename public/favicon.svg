<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Obsidian Black -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    
    <!-- Gold Gradient for embroidery thread & book spine -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Silver/Steel Gradient for the embroidery needle -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Base Badge with Soft Golden Rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Subtle inner ambient rim -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Open Dictionary Book Pages (Left and Right Wings) -->
  <!-- Left Page -->
  <path d="M12 43 C 18 41, 26 41, 32 44 L 32 20 C 26 17, 18 17, 12 19 Z" 
        fill="#1e293b" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-linejoin="round"/>
        
  <!-- Right Page -->
  <path d="M52 43 C 46 41, 38 41, 32 44 L 32 20 C 38 17, 46 17, 52 19 Z" 
        fill="#0f172a" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Book Page Embossed Stitch Lines (Technical Dictionary Pages) -->
  <path d="M17 26 C 21 24.5, 25 24.5, 28 26" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M17 31 C 21 29.5, 25 29.5, 28 31" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M17 36 C 21 34.5, 25 34.5, 28 36" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <path d="M36 26 C 39 24.5, 43 24.5, 47 26" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M36 31 C 39 29.5, 43 29.5, 47 31" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M36 36 C 39 34.5, 43 34.5, 47 36" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Golden Embroidery Thread Loop (Curving out of the book) -->
  <path d="M22 14 C 27 8, 38 7, 44 13 C 47 16, 46 22, 40 24 C 35 25, 30 29, 32 35" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-linecap="round"/>

  <!-- Precision Embroidery Needle passing diagonally through the center -->
  <g transform="rotate(38 34 26)">
    <!-- Needle Body -->
    <path d="M32 10 L35 10 L34.2 38 L33.5 44 L32.8 38 Z" fill="url(#needleGrad)"/>
    <!-- Needle Eye -->
    <ellipse cx="33.5" cy="14" rx="0.8" ry="2.2" fill="#09090b"/>
  </g>

  <!-- Small sparkling embroidery cross-stitch star at top right -->
  <path d="M49 10 L51 10 M50 9 L50 11" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
